<!doctype html>
<!-- Workspace shell: stylesheet order follows theme, base markup, startup, workspace, editor, then dialogs. -->
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EPUB 만들기</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("epub-theme") || "dark"; } catch {}</script>
    <link rel="stylesheet" href="theme.css?v=20261008-77">
    <link rel="stylesheet" href="editor-tools.css">
    <link rel="stylesheet" href="asset-shelf.css">
    <link rel="stylesheet" href="screen-base.css">
    <link rel="stylesheet" href="startup-screen.css">
    <link rel="stylesheet" href="project-launcher.css">
    <link rel="stylesheet" href="workspace.css">
    <link rel="stylesheet" href="editor-host.css">
    <link rel="stylesheet" href="text-style-dialog.css">
    <link rel="stylesheet" href="settings-dialog.css">
    <script type="module" src="dist/app-access.js"></script>
</head>

<body>
    <section id="accessMessage" data-phase="access" aria-label="작업실 준비">
        <div class="startup-content">
            <p class="startup-brand">SITESCOUT <span>YOUR CREATIVE WORKSPACE</span></p>
            <div class="startup-card">
                <div class="startup-emblem" aria-hidden="true"><span class="startup-monogram">J</span></div>
                <div class="startup-status" role="status" aria-live="polite" aria-atomic="true">
                    <h1 class="startup-title">작업실을 열고 있어요</h1>
                    <p class="startup-description">작업 공간을 준비하고 있습니다. 잠시만 기다려 주세요.</p>
                </div>
                <div class="startup-progress" aria-hidden="true">
                    <svg class="startup-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                    <span class="startup-step-access">접근 확인</span><span class="startup-step-divider"></span><span class="startup-step-editor">작업 공간 준비</span>
                </div>
                <a class="startup-retry" href="./" hidden>다시 시도</a>
            </div>
            <p class="startup-note">아이디어를 작업으로, 작업을 가능성으로</p>
        </div>
    </section>
    <section id="projectLauncher" aria-label="프로젝트 선택" hidden>
        <div class="project-launcher-content">
            <p class="project-launcher-brand">JH Studio</p>
            <h1>프로젝트</h1>
            <p class="project-launcher-message" role="status" aria-live="polite"></p>
            <div class="project-launcher-list"></div>
            <div class="project-launcher-actions">
                <button type="button" data-project-new>새 EPUB 만들기</button>
                <button type="button" data-project-retry hidden>목록 다시 불러오기</button>
            </div>
        </div>
    </section>
    <div class="app" inert style="visibility:hidden">
        <aside class="side">
            <nav class="tabs" aria-label="프로젝트"><button class="tab active" data-view="editorView">프로젝트</button></nav>
            <p class="tip">인터넷이나 서버 없이 작동합니다.<br>원고와 이미지는 이 브라우저 안에서만 처리됩니다.</p>
        </aside>
        <main>
            <div class="top"><button id="export" class="primary">EPUB 3.0 내보내기</button></div>
            <div id="status" class="status" role="status" aria-live="polite"></div>
            <div id="editorView" class="view active">
                <div class="grid">
                    <aside class="card">
                        <div class="head">책의 구성</div>
                        <div id="list" class="chapters"></div><button id="add" class="add">＋ 장 추가</button>
                    </aside>
                    <article class="card editor">
                        <div class="fields">
                            <div><label for="ctitle">장 제목 / 목차 표시명</label><input id="ctitle"></div>
                            <div><label for="clevel">목차 단계</label><input id="clevel" type="number" min="1" max="3">
                            </div>
                            <div class="full"><label for="body">본문 HTML — &lt;body&gt; 안에 넣을 내용만 작성하세요</label><textarea
                                    id="body" class="code" spellcheck="false"></textarea></div>
                        </div>
                        <div class="toolbar"><label class="secondary" for="image">이미지 업로드·삽입</label><input id="image"
                                type="file" accept="image/jpeg,image/png,image/gif,image/svg+xml" multiple
                                hidden><button id="del"
                                class="secondary danger">이 장 삭제</button></div>
                    </article>
                    <aside class="card preview-card">
                        <div class="head">미리보기</div>
                        <div id="preview" class="preview"></div>
                    </aside>
                </div>
            </div>
            <div id="bookView" class="view">
                <aside class="card settings">
                    <div class="head">책 정보</div>
                    <section>
                        <div class="field"><label for="title">책 제목</label><input id="title" value="새 전자책"></div>
                        <div class="field"><label for="author">저자</label><input id="author" placeholder="이름"></div>
                        <div class="field"><label for="language">언어</label><input id="language" value="ko"></div>
                        <div class="field"><label for="coverInput">표지 이미지</label>
                            <div class="cover"><input id="coverInput" type="file" accept="image/jpeg,image/png"><img
                                    id="coverPreview" hidden></div>
                            <p class="hint">JPG 또는 PNG, 세로형 이미지를 권장합니다.</p>
                        </div>
                    </section>
                </aside>
            </div>
            <div id="styleView" class="view">
                <aside class="card settings">
                    <div class="head">공통 CSS</div>
                    <section><textarea id="css"
                            class="css">body { font-family: serif; line-height: 1.8; } p { margin: 0 0 1em; } img { max-width: 100%; height: auto; } h1, h2, h3 { line-height: 1.4; }</textarea>
                        <p class="hint">모든 장에 자동으로 적용됩니다.</p>
                        <ul id="images" class="images"></ul>
                    </section>
                </aside>
            </div>
        </main>
    </div>
    <!-- Monaco와 Emmet은 HTML 편집 모드에서만 로드합니다. 기존 정적 앱 구조를 유지합니다. -->
    <script src="dist/monaco/vs/loader.js"></script>
    <script type="module" src="dist/app-startup.js"></script>
</body>

</html>
